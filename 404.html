<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ours</title>
  <meta name="color-scheme" content="light dark">
  <script>
    // Old invite links (getours.site/join/OURS-XXXXXX) have no page of their own on GitHub Pages:
    // send them to the join page with the code as ?code=.
    (function () {
      var m = location.pathname.match(/^\/join\/([^\/?#]+)/);
      if (m) location.replace('/join/?code=' + encodeURIComponent(decodeURIComponent(m[1])));
    })();
  </script>
  <style>
    :root { --cream: #faf7f2; --ink: #1a1612; --muted: #6b6460; --accent: #c9705a; }
    @media (prefers-color-scheme: dark) { :root { --cream: #1b1513; --ink: #f3e6df; --muted: #bfa79c; --accent: #e0856f; } }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--cream); color: var(--ink); font: 300 16px/1.6 -apple-system, 'Helvetica Neue', sans-serif; text-align: center; padding: 20px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <p>This page doesn't exist. <a href="/">Go to getours.site</a></p>
</body>
</html>
